            position: absolute; left: 50%; transform: translateX(-50%);

            { source: "韓立", target: "血焰古魔", value: "墜魔谷死戰" },
            { source: "韓立", target: "元剎", value: "昆吾山參與鎮壓分念" },
            { source: "韓立", target: "木青", value: "地淵妖王，騙取神乳" },
            { source: "韓立", target: "元魘", value: "洗靈池大戰" },
            { source: "韓立", target: "馬良", value: "靈界滅世，玄天斬仙" },
            { source: "韓立", target: "螟蟲之母", value: "聯手寶花鎮壓" },
            { source: "韓立", target: "方磐", value: "仙界初期暗算，後反殺" },
            { source: "韓立", target: "蕭晉寒", value: "冥寒仙府怒斬金仙" },
            { source: "韓立", target: "古或今", value: "時間大道終極之戰，擊殺" },
            { source: "輪迴殿主", target: "古或今", value: "宿命死敵" }
        ];

        // --- App Logic ---
        let currentTimelineFilter = '全部';
        let currentSearchTimeline = '';

        function getRealmColorTheme(realmType) {
            if (realmType === '人界篇') return { text: 'text-emerald-400', border: 'border-emerald-500/40', bg: 'bg-emerald-900/20' };
            if (realmType === '靈界篇') return { text: 'text-cyan-400', border: 'border-cyan-500/40', bg: 'bg-cyan-900/20' };
            if (realmType === '仙界篇') return { text: 'text-amber-400', border: 'border-amber-500/40', bg: 'bg-amber-900/20' };
            return { text: 'text-gray-300', border: 'border-gray-500/40', bg: 'bg-gray-800/20' };
        }

        // --- Timeline Logic ---
        function filterTimeline(realmType) {
            currentTimelineFilter = realmType;
            document.querySelectorAll('#view-timeline .filter-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`filter-${realmType}`).classList.add('active');
            renderTimeline();
        }

        function toggleCard(headerElement) {
            const card = headerElement.closest('.event-card');
            card.classList.toggle('expanded');
        }

        function toggleAllCards() {
            const btn = document.getElementById('toggleAllBtn');
            const isExpanding = btn.innerHTML.includes('展開');
            const cards = document.querySelectorAll('.event-card');
            
            cards.forEach(card => {
                if (isExpanding) card.classList.add('expanded');
                else card.classList.remove('expanded');
            });

            if (isExpanding) {
                btn.innerHTML = '<i class="fa-solid fa-angles-up"></i> <span class="hidden sm:inline">全部收合</span>';
            } else {
                btn.innerHTML = '<i class="fa-solid fa-angles-down"></i> <span class="hidden sm:inline">全部展開</span>';
            }
        }

        function renderTimeline() {
            const container = document.getElementById('timeline-container');
            if(!container) return;
            container.innerHTML = '';
            
            currentSearchTimeline = document.getElementById('searchTimeline').value.toLowerCase();
            let filteredData = timelineData;
            
            if (currentTimelineFilter !== '全部') {
                filteredData = filteredData.filter(item => item.realmType === currentTimelineFilter);
            }
            if (currentSearchTimeline.trim() !== '') {
                filteredData = filteredData.filter(item => {
                    const str = `${item.phase} ${item.event} ${item.location} ${item.combat} ${item.relations} ${item.loot} ${item.techniques} ${item.insects}`.toLowerCase();
                    return str.includes(currentSearchTimeline);
                });
            }

            const resultCountElement = document.getElementById('resultCount');
            if (resultCountElement) {
                resultCountElement.innerText = `檢索到 ${filteredData.length} 條因果`;
            }
            
            const autoExpand = currentSearchTimeline.trim() !== '' ? 'expanded' : '';

            let html = '';

            filteredData.forEach((item, index) => {
                const isLeft = index % 2 === 0;
                // Flex佈局：確保左右對稱且與中央年齡標籤防重疊 (5/12 - 2/12 - 5/12)
                const layoutClass = isLeft ? 'flex-row' : 'flex-row-reverse';
                const theme = getRealmColorTheme(item.realmType);

                html += `
                <div class="flex flex-col md:${layoutClass} w-full items-center justify-between relative z-10 group">
                    
                    <!-- 卡片區域 (佔寬 42%) -->
                    <div class="w-full md:w-[43%] z-20">
                        <div class="glass-card event-card rounded-2xl p-5 ${autoExpand} ${theme.border}">
                            
                            <!-- Header -->
                            <div class="cursor-pointer flex flex-col gap-2 select-none" onclick="toggleCard(this)">
                                <div class="flex justify-between items-center">
                                    <span class="text-[10px] px-2 py-0.5 rounded ${theme.bg} border ${theme.border} ${theme.text} tracking-wider">${item.realmType}</span>
                                    <i class="fa-solid fa-chevron-down text-gray-500 chevron-icon"></i>
                                </div>
                                <h3 class="text-xl font-serif font-bold ${theme.text} drop-shadow-md">${item.phase}</h3>
                                <div class="text-[13px] text-gray-400 font-light flex justify-between items-center mt-1">
                                    <span class="md:hidden text-amber-500 font-bold tracking-widest">${item.age}</span>
                                    <span class="flex items-center gap-1.5"><i class="fa-solid fa-location-dot text-gray-600"></i> ${item.location}</span>
                                    <span class="text-purple-400/90 font-medium">${item.realm}</span>
                                </div>
                            </div>

                            <!-- Body (收合區域) -->
                            <div class="collapse-content">
                                <p class="text-gray-300 text-[14px] leading-relaxed mb-4 font-light">${item.event}</p>
                                
                                <div class="bg-black/40 p-3 rounded-xl border border-white/5 mb-3">
                                    <span class="text-gray-500 text-[11px] block mb-1"><i class="fa-solid fa-khanda text-red-500/80 mr-1.5"></i>戰鬥紀錄</span>
                                    <span class="text-gray-200 text-[13px]">${item.combat}</span>
                                    ${item.kills !== '無' ? `<div class="text-red-400 text-[11px] mt-2 font-medium border-t border-red-900/30 pt-1.5"><i class="fa-solid fa-skull mr-1"></i>斬殺: ${item.kills}</div>` : ''}
                                </div>

                                <div class="flex flex-wrap gap-2 mb-4">
                                    ${item.loot !== '無' ? `<span class="mini-tag text-cyan-300"><i class="fa-solid fa-box-open text-cyan-600"></i>${item.loot}</span>` : ''}
                                    ${item.techniques !== '無' ? `<span class="mini-tag text-purple-300"><i class="fa-solid fa-book text-purple-600"></i>${item.techniques}</span>` : ''}
                                    ${item.abilities !== '無' ? `<span class="mini-tag text-indigo-300"><i class="fa-solid fa-bolt text-indigo-600"></i>${item.abilities}</span>` : ''}
                                    ${item.insects !== '無' ? `<span class="mini-tag text-emerald-300"><i class="fa-solid fa-bug text-emerald-600"></i>${item.insects}</span>` : ''}
                                </div>

                                <div class="text-[12px] bg-gradient-to-r from-gray-900/80 to-transparent py-2.5 px-3 rounded-lg border-l-2 ${theme.border} font-light">
                                    <span class="text-gray-500">人際羈絆：</span><span class="text-gray-200 ml-1">${item.relations}</span>
                                </div>
                                
                                ${item.lost !== '無' ? `
                                <div class="mt-3 text-red-300 text-[11px] bg-red-900/20 px-3 py-1.5 rounded-lg border border-red-900/50 flex items-center gap-2 font-medium">
                                    <i class="fa-solid fa-fire text-red-500"></i>代價/失去: ${item.lost}
                                </div>` : ''}
                            </div>
                        </div>
                    </div>

                    <!-- 中央留白與徽章 (佔寬 14%) -->
                    <div class="hidden md:flex w-[14%] justify-center relative">
                        <div class="absolute top-8 w-full h-[1px] z-0 ${isLeft ? 'bg-gradient-to-l right-1/2' : 'bg-gradient-to-r left-1/2'} from-transparent to-white/20"></div>
                        <div class="age-badge-wrapper absolute top-8 transform -translate-y-1/2 z-20 transition-transform duration-300 group-hover:scale-110">
                            <div class="age-badge text-[12px] font-bold px-3 py-1.5 rounded-full whitespace-nowrap ${theme.text} ${theme.border} tracking-widest">
                                ${item.age}
                            </div>
                        </div>
                    </div>

                    <!-- 佔位對稱 (佔寬 43%) -->
                    <div class="hidden md:block w-[43%]"></div>

                </div>
                `;
            });

            container.innerHTML = html;
        }

        // --- Massive ECharts Logic ---
        let myChart = null;

        function initChart() {
            if (myChart != null) return;
            const chartDom = document.getElementById('echarts-container');
            myChart = echarts.init(chartDom);
            const option = {
                backgroundColor: 'transparent',
                legend: {
                    data: chartCategories.map(c => c.name),
                    textStyle: { color: '#cbd5e1', fontSize: 12 },
                    top: 20,
                    right: 20,
                    orient: 'vertical',
                    backgroundColor: 'rgba(5, 10, 20, 0.8)',
                    padding: 15,
                    borderRadius: 12,
                    borderWidth: 1,
                    borderColor: '#334155',
                    itemGap: 12
                },
                tooltip: {
                    trigger: 'item',
                    formatter: function (params) {
                        if (params.dataType === 'edge') {
                            return `<div class="text-sm px-4 py-3 bg-black/95 rounded-lg border border-gray-700 backdrop-blur-md shadow-2xl">
                                        <div class="text-gray-400 mb-1 font-mono text-[10px]">因果牽連</div>
                                        <b>${params.data.source}</b> <i class="fa-solid fa-arrow-right text-gray-500 text-xs mx-1"></i> <b>${params.data.target}</b><br>
                                        <span class="text-amber-400 mt-2 block font-bold tracking-wide">${params.data.value}</span>
                                    </div>`;
                        }
                        return `<div class="font-bold text-lg px-3 py-1 text-white drop-shadow-lg">${params.name.replace('\n', ' ')}<br>
                                <span class="text-xs text-gray-400 font-normal tracking-widest">${params.data.category}</span></div>`;
                    },
                    backgroundColor: 'rgba(0,0,0,0)',
                    borderWidth: 0,
                    shadowBlur: 0
                },
                series: [{
                    type: 'graph',
                    layout: 'force',
                    roam: true,
                    draggable: true,
                    categories: chartCategories,
                    label: {
                        show: true,
                        position: 'right',
                        color: '#f8fafc',
                        fontSize: 12,
                        fontFamily: '"Noto Sans TC", sans-serif',
                        textBorderColor: '#020617',
                        textBorderWidth: 4,
                        distance: 8
                    },
                    edgeLabel: {
                        show: true,
                        fontSize: 10,
                        formatter: "{c}",
                        color: '#94a3b8',
                        textBorderColor: 'rgba(5, 10, 20, 0.9)',
                        textBorderWidth: 3,
                        backgroundColor: 'rgba(5, 10, 20, 0.7)',
                        padding: [3, 5],
                        borderRadius: 4
                    },
                    edgeSymbol: ['none', 'arrow'],
                    edgeSymbolSize: [0, 8],
                    force: { 
                        repulsion: 3800, // 高斥力拉開80個節點
                        edgeLength: 220, 
                        gravity: 0.05,
                        friction: 0.15
                    },
                    data: chartNodes,
                    links: chartLinks.map(link => ({
                        ...link,
                        lineStyle: {
                            color: link.value.includes('殺') || link.value.includes('死') || link.value.includes('敵') || link.value.includes('仇') ? '#ef4444' : 
                                   link.value.includes('妻') || link.value.includes('紅顏') ? '#ec4899' : 
                                   link.value.includes('傳承') || link.value.includes('師') || link.value.includes('前世') || link.value.includes('轉世') ? '#a855f7' : '#64748b',
                            width: link.value.includes('殺') || link.value.includes('妻') || link.value.includes('死敵') || link.value.includes('轉世') ? 3 : 1.5,
                            opacity: 0.7,
                            curveness: Math.random() * 0.2 + 0.15 // 隨機曲度避免多條線重疊
                        }
                    }))
                }]
            };
            myChart.setOption(option);
            window.addEventListener('resize', () => myChart.resize());
        }

        // --- Tabs Logic ---
        function switchMainTab(tab) {
            const timelineView = document.getElementById('view-timeline');
            const chartView = document.getElementById('view-chart');
            const btnTimeline = document.getElementById('btn-timeline');
            const btnChart = document.getElementById('btn-chart');

            if (tab === 'timeline') {
                timelineView.classList.remove('hidden');
                chartView.classList.add('hidden');
                btnTimeline.className = "px-6 py-2 rounded-lg text-sm font-bold bg-gradient-to-b from-gray-700 to-gray-900 text-white shadow-md border border-gray-500 transition-all flex items-center gap-2";
                btnChart.className = "px-6 py-2 rounded-lg text-sm font-bold text-gray-400 hover:text-white hover:bg-gray-800/80 border border-transparent transition-all flex items-center gap-2";
            } else {
                timelineView.classList.add('hidden');
                chartView.classList.remove('hidden');
                btnChart.className = "px-6 py-2 rounded-lg text-sm font-bold bg-gradient-to-b from-gray-700 to-gray-900 text-white shadow-md border border-gray-500 transition-all flex items-center gap-2";
                btnTimeline.className = "px-6 py-2 rounded-lg text-sm font-bold text-gray-400 hover:text-white hover:bg-gray-800/80 border border-transparent transition-all flex items-center gap-2";
                setTimeout(initChart, 100);
            }
        }

        // Init
        window.onload = () => {
            renderTimeline();
        };
    </script>
</body>
</html>
